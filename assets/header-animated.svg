<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="50%" stop-color="#0A0D18"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="ambient1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(168,85,247,0.3)); }
      50% { filter: drop-shadow(0 0 24px rgba(99,102,241,0.6)); }
    }
    .laser-beam {
      animation: scan 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .status-pulse {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 145px 36px;
    }
    .ambient-float {
      animation: floatOrb 6s ease-in-out infinite;
    }
    .title-glow {
      animation: textGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1F2438" stroke-width="1.2"/>
  <rect width="900" height="240" rx="16" fill="url(#ambient1)" class="ambient-float"/>
  <rect width="900" height="240" rx="16" fill="url(#ambient2)"/>

  <!-- Top Laser Scanner Line -->
  <g clip-path="url(#cardClip)">
    <line x1="0" y1="2" x2="900" y2="2" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <rect x="0" y="0" width="300" height="3" fill="url(#laserGrad)" class="laser-beam"/>
  </g>

  <!-- Status Chip -->
  <g transform="translate(40, 24)">
    <rect width="360" height="26" rx="13" fill="#131728" stroke="#2D3758" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#10B981" class="status-pulse"/>
    <text x="30" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">
      SYSTEMS &amp; AI ARCHITECT &middot; PRODUCTION RUNTIME
    </text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(40, 95)" class="title-glow">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Instrument Serif', Georgia, serif" font-size="38" font-weight="400" letter-spacing="-0.5">
      J. &mdash; Systems &amp; AI Solutions Architect
    </text>
  </g>

  <!-- Tagline Subtitle -->
  <g transform="translate(40, 130)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="300" letter-spacing="0.2">
      Orquestração n8n &middot; Guardrails Antialucinação &middot; Concorrência Go &middot; Observabilidade Prometheus
    </text>
  </g>

  <!-- Live Badges Bar -->
  <g transform="translate(40, 165)">
    <!-- Badge 1: Hallucination Rate -->
    <g transform="translate(0, 0)">
      <rect width="185" height="46" rx="10" fill="#0C0F1D" stroke="#1E2640" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-family="monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">TAXA DE ALUCINAÇÃO</text>
      <text x="14" y="38" fill="#10B981" font-family="monospace" font-size="15" font-weight="700">0.00% &middot; AST</text>
    </g>

    <!-- Badge 2: Concurrency Go -->
    <g transform="translate(195, 0)">
      <rect width="195" height="46" rx="10" fill="#0C0F1D" stroke="#1E2640" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-family="monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">VAZÃO WHATSAPP</text>
      <text x="14" y="38" fill="#818CF8" font-family="monospace" font-size="15" font-weight="700">12.8k msg/s (Go)</text>
    </g>

    <!-- Badge 3: Monitored Groups -->
    <g transform="translate(400, 0)">
      <rect width="195" height="46" rx="10" fill="#0C0F1D" stroke="#1E2640" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-family="monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">GRUPOS VIGIADOS</text>
      <text x="14" y="38" fill="#22D3EE" font-family="monospace" font-size="15" font-weight="700">480+ Ativos</text>
    </g>

    <!-- Badge 4: RLS Isolation -->
    <g transform="translate(605, 0)">
      <rect width="215" height="46" rx="10" fill="#0C0F1D" stroke="#1E2640" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-family="monospace" font-size="9.5" font-weight="600" letter-spacing="0.8">ISOLAMENTO MULTI-TENANT</text>
      <text x="14" y="38" fill="#C084FC" font-family="monospace" font-size="15" font-weight="700">100% PostgreSQL RLS</text>
    </g>
  </g>
</svg>
